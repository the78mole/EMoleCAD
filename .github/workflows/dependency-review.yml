name: Dependency Review

# Prüft in Pull Requests neu hinzukommende Abhängigkeiten auf bekannte
# Schwachstellen und unpassende Lizenzen.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Abhängigkeiten prüfen
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
