name: CodeQL

# Statische Sicherheitsanalyse (SAST) für TypeScript/JavaScript und die
# Workflows selbst. Ergebnisse landen im Code Scanning (Security-Tab).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse (${{ matrix.sprache }})
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        sprache: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.sprache }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.sprache }}
